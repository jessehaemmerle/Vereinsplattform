<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Passwort setzen</title>
</head>
<body>
  <h1>Passwort setzen</h1>
  <p>E-Mail: {{ email }}</p>
  <p>Verein: {{ verein_name }}</p>

  <form method="POST" action="{{ url_for('register_member_verein', step='set_password') }}">
    {{ form.hidden_tag() }}

    <label for="password">Neues Passwort:</label>
    {{ form.password(id="password", required=true) }}

    <label for="confirm_password">Passwort bestaetigen:</label>
    {{ form.confirm_password(id="confirm_password", required=true) }}

    {{ form.submit() }}
  </form>
</body>
</html>
