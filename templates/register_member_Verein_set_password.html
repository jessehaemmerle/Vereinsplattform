<!-- templates/register_member_verein_set_password.html -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Passwort setzen (Schritt 2)</title>
</head>
<body>
  <h1>Passwort setzen</h1>
  <p>E-Mail: {{ email }}</p>
  <p>Verein: {{ verein_name }}</p>

  <form method="POST" action="{{ url_for('register_member_verein', step='set_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">  <!-- Manuelle CSRF-Einbindung ohne WTForms-Form-Klasse -->

    <label for="password">Neues Passwort:</label>
    <input type="password" name="password" id="password" required>

    <button type="submit">Abschließen</button>
  </form>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul>
        {% for category, msg in messages %}
          <li class="text-{{ category }}">{{ msg }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
</body>
</html>
