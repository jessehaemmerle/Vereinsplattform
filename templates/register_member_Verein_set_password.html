<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Passwort setzen</title>
</head>
<body>
  <h1>Passwort setzen</h1>
  <p>E-Mail: {{ email }}</p>
  <p>Verein: {{ verein_name }}</p>

  <form method="POST" action="{{ url_for('register_member_verein', step='set_password') }}">
    <label for="password">Neues Passwort:</label>
    <input type="password" name="password" id="password" required>

    <button type="submit">Abschließen</button>
  </form>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul>
        {% for category, msg in messages %}
          <li class="text-{{ category }}">{{ msg }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
</body>
</html>
