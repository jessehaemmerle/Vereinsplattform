<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Mitglieder-Dashboard</title>
    <!-- Dein CSS / Bootstrap etc. -->
</head>
<body>
    <h1>Willkommen, {{ mitglied.vorname }} {{ mitglied.nachname }}!</h1>

</body>
</html>
