<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Mitglied werden</title>
</head>
<body>
  <h1>Mitglied-Registrierung</h1>
  <form method="POST" action="{{ url_for('register_member_verein', step='choose') }}">
    {{ form.hidden_tag() }}
    <label for="email">E-Mail:</label>
    <input type="email" name="email" id="email" required>

    <label for="verein_id">Verein auswählen:</label>
    <select name="verein_id" id="verein_id" required>
      <option value="">-- Bitte wählen --</option>
      {% for v in alle_vereine %}
        <option value="{{ v.id }}">{{ v.name }}</option>
      {% endfor %}
    </select>

    <button type="submit">Weiter</button>
  </form>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul>
        {% for category, msg in messages %}
          <li class="text-{{ category }}">{{ msg }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
</body>
</html>
