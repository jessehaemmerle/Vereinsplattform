{% extends "base.html" %}
{% block title %}Dashboard - Vereinsverwaltung{% endblock %}
{% block content %}

<h1 class="mb-4">Dashboard</h1>
<h2>Das Dashboard ist aktuell noch in einem nicht-funktionalen Zustand. Ich arbeite bereits an einer Lösung der Probleme, bis dahin ist das Dashboard nicht brauchbar.</h2>

<!-- Buttons / Menü -->
<div class="mt-4 d-flex justify-content-between">
  <button id="addWidgetButton" class="btn btn-primary">Widget hinzufügen</button>

  <div id="widgetDropdown" class="dropdown" style="display: none;">
    <select id="widgetSelect" class="form-select">
      <option value="" disabled selected>Wählen Sie ein Widget</option>
      <option value="mitglieder">Mitglieder</option>
      <option value="events">Events</option>
      <option value="notizen">Notizen</option>
      <option value="saldo">Saldo</option>
      <option value="einnahmen-ausgaben">Einnahmen vs. Ausgaben</option>
      <option value="mitgliederstatus">Mitgliederstatus</option>
      <option value="bevorstehende-events">Bevorstehende Events</option>
      <option value="neueste-mitglieder">Neueste Mitglieder</option>
      <option value="events-pro-monat">Events pro Monat</option>
    </select>
    <button id="confirmWidgetButton" class="btn btn-success mt-2">Hinzufügen</button>
  </div>

  <button class="btn btn-danger" id="toggleRemoveMode">Widget Entfernen</button>
</div>

<!-- Dashboard-Container -->
<div id="dashboardContainer" class="dashboard-container">
  <!-- Widgets will be dynamically added here -->
</div>

<!-- SCRIPTS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='/static/main.js') }}"></script>

{% endblock %}
