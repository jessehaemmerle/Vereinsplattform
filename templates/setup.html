<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card shadow">
                    <div class="card-header text-center">
                        <h3>Setup für deinen Verein</h3>
                        <p>Wähle die gewünschten Funktionen für deinen Verein aus</p>
                    </div>
                    <div class="card-body">
                        <form method="POST" enctype="multipart/form-data">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                            <!-- Vereinsname -->
                            <div class="mb-3">
                                <label class="form-label"><strong>Vereinsname</strong></label>
                                <input type="text" class="form-control" name="verein_name" value="{{ verein.name }}" required>
                            </div>
                    
                            <!-- Logo hochladen -->
                            <div class="mb-3">
                                <label class="form-label"><strong>Vereinslogo</strong></label>
                                <input type="file" class="form-control" name="logo">
                            </div>
                    
                            <!-- Features -->
                            <div class="mb-3">
                                <label class="form-label"><strong>Verfügbare Features</strong></label>
                                <div class="form-check">
                                    {% for feature in features %}
                                    <div>
                                        <input 
                                            class="form-check-input" 
                                            type="checkbox" 
                                            name="features" 
                                            id="{{ feature.name }}" 
                                            value="{{ feature.name }}" 
                                            {{ feature.checked }}
                                        >
                                        <label class="form-check-label" for="{{ feature.name }}">
                                            {{ feature.name }}
                                        </label>
                                    </div>
                                    {% endfor %}
                                </div>
                            </div>
                    
                            <button type="submit" class="btn btn-primary w-100">Speichern</button>
                        </form>
                    </div>                    
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
