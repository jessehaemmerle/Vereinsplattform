{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h1>Notizen</h1>
    <a href="{{ url_for('notiz_new') }}" class="btn btn-primary mb-3">+ Neue Notiz</a>
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Titel</th>
                    <th>Aktionen</th>
                </tr>
            </thead>
            <tbody>
                {% for n in notizen %}
                    <tr>
                        <td>{{ n.id }}</td>
                        <td>{{ n.titel }}</td>
                        <td class="d-flex">
                            <a href="{{ url_for('notiz_edit', notiz_id=n.id) }}" class="btn btn-warning btn-sm me-2">Bearbeiten</a>
                            <form action="{{ url_for('notiz_delete', notiz_id=n.id) }}" method="POST" style="display:inline;">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                <button type="submit" class="btn btn-danger btn-sm">Löschen</button>
                            </form>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
