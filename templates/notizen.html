{% extends "base.html" %}
{% block content %}
<h1>Notizen</h1>
<a href="{{ url_for('notiz_new') }}">+ Neue Notiz</a>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Titel</th>
            <th>Aktionen</th>
        </tr>
    </thead>
    <tbody>
    {% for n in notizen %}
        <tr>
            <td>{{ n.id }}</td>
            <td>{{ n.titel }}</td>
            <td>
                <a href="{{ url_for('notiz_edit', notiz_id=n.id) }}">Bearbeiten</a>
                <form action="{{ url_for('notiz_delete', notiz_id=n.id) }}" method="POST" style="display:inline;">
                    <button type="submit">Löschen</button>
                </form>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
