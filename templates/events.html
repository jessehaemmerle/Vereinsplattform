{% extends "base.html" %}
{% block content %}
<h1>Events</h1>
<a href="{{ url_for('event_new') }}">+ Neues Event</a>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Titel</th>
            <th>Datum</th>
            <th>Ort</th>
            <th>Aktionen</th>
        </tr>
    </thead>
    <tbody>
    {% for e in events %}
        <tr>
            <td>{{ e.id }}</td>
            <td>{{ e.titel }}</td>
            <td>{{ e.datum }}</td>
            <td>{{ e.ort }}</td>
            <td>
                <a href="{{ url_for('event_edit', event_id=e.id) }}">Bearbeiten</a>
                <form action="{{ url_for('event_delete', event_id=e.id) }}" method="POST" style="display:inline;">
                    <button type="submit">Löschen</button>
                </form>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
