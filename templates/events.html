{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h1>Events</h1>
    <a href="{{ url_for('event_new') }}" class="btn btn-primary mb-3">+ Neues Event</a>
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Titel</th>
                    <th>Beschreibung</th>
                    <th>Datum</th>
                    <th>Ort</th>
                    <th>Preis</th>
                    <th>Aktionen</th>
                </tr>
            </thead>
            <tbody>
                {% for event in events %}
                <tr>
                    <td>{{ event.titel }}</td>
                    <td>{{ event.beschreibung }}</td>
                    <td>{{ event.datum }}</td>
                    <td>{{ event.ort }}</td>
                    <td>{{ event.preis or 'Kostenlos' }}</td>
                    <td>
                        <a href="{{ url_for('event_edit', event_id=event.id) }}" class="btn btn-warning btn-sm">Bearbeiten</a>
                        <form action="{{ url_for('event_delete', event_id=event.id) }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-danger btn-sm">Löschen</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
            
        </table>
    </div>
</div>
{% endblock %}
