{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h1>Events</h1>
    <a href="{{ url_for('event_new') }}" class="btn btn-primary mb-3">+ Neues Event</a>
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Titel</th>
                    <th>Datum</th>
                    <th>Ort</th>
                    <th>Aktionen</th>
                </tr>
            </thead>
            <tbody>
                {% for e in events %}
                    <tr>
                        <td>{{ e.id }}</td>
                        <td>{{ e.titel }}</td>
                        <td>{{ e.datum }}</td>
                        <td>{{ e.ort }}</td>
                        <td class="d-flex">
                            <a href="{{ url_for('event_edit', event_id=e.id) }}" class="btn btn-warning btn-sm me-2">Bearbeiten</a>
                            <form action="{{ url_for('event_delete', event_id=e.id) }}" method="POST" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm">Löschen</button>
                            </form>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
